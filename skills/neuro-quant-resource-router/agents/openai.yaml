  short_description: "Route long neuro-quant tasks to the smallest relevant skill, local resource, KB leaf, or deep-tool-wiki page."
  default_prompt: "Use $neuro-quant-resource-router for this neuro-quant workflow."
policy:
  allow_implicit_invocation: true
  require_resource_map_first: true
resources:
  local:
    - references/resource-map.md
    - references/verification-checklist.md
  full_docs:
    - deep-tool-wiki
    - neuro-link/02-KB-main
